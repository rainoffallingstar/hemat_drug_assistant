name: Build & Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go binary (Linux)
        run: GOOS=linux GOARCH=amd64 go build -o bin/mellon-api ./cmd/mellon-api/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React frontend
        run: |
          cd ui
          npm ci
          npm run build

      - name: Copy React build to www/
        run: rm -rf www/assets && cp -r ui/dist/* www/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install rsconnect
        run: pip install rsconnect-python

      - name: Deploy to shinyapps.io
        env:
          RSCONNECT_ACCOUNT:  ${{ secrets.RSCONNECT_ACCOUNT }}
          RSCONNECT_TOKEN:    ${{ secrets.RSCONNECT_TOKEN }}
          RSCONNECT_SECRET:   ${{ secrets.RSCONNECT_SECRET }}
          PYTHON_BIN:         python3
        run: |
          rsconnect add --account "$RSCONNECT_ACCOUNT" --name "$RSCONNECT_ACCOUNT" \
            --token "$RSCONNECT_TOKEN" --secret "$RSCONNECT_SECRET"
          bash scripts/deploy_shinyapps.sh
